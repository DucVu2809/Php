<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2f6"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#607d8b"/>
      <stop offset="1" stop-color="#37474f"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0e2a47" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>
  <!-- lưới mờ nền công nghiệp -->
  <g stroke="#0e2a47" stroke-opacity="0.04" stroke-width="2">
    <path d="M0 150 H600 M0 300 H600 M0 450 H600 M150 0 V600 M300 0 V600 M450 0 V600"/>
  </g>

  <!-- bóng nền tròn theo màu nhấn -->
  <circle cx="300" cy="285" r="180" fill="#607d8b" opacity="0.08"/>

  <g filter="url(#sh)">
    <!-- khung đỡ -->
    <rect x="150" y="392" width="300" height="26" rx="13" fill="#445"/>
    <!-- thân máy -->
    <rect x="180" y="250" width="240" height="150" rx="14" fill="#5b6b7b"/>
    <rect x="180" y="250" width="240" height="46" rx="14" fill="url(#acc)"/>
    <rect x="180" y="282" width="240" height="14" fill="#37474f" opacity="0.5"/>
    <!-- bình nhiên liệu phía trên -->
    <rect x="232" y="206" width="136" height="60" rx="22" fill="#3c4a59"/>
    <!-- bảng điều khiển -->
    <rect x="206" y="312" width="92" height="68" rx="8" fill="#1f2a36"/>
    <circle cx="232" cy="338" r="13" fill="#607d8b"/>
    <circle cx="232" cy="338" r="6" fill="#fff" opacity="0.85"/>
    <rect x="256" y="328" width="30" height="8" rx="4" fill="#5b6b7b"/>
    <rect x="256" y="344" width="30" height="8" rx="4" fill="#5b6b7b"/>
    <rect x="216" y="362" width="72" height="8" rx="4" fill="#607d8b" opacity="0.8"/>
    <!-- ống xả -->
    <rect x="330" y="300" width="70" height="20" rx="10" fill="#2f3a47"/>
    <circle cx="402" cy="310" r="14" fill="#2f3a47"/>
    <circle cx="402" cy="310" r="7" fill="#1a222b"/>
    <!-- tay cầm -->
    <path d="M150 250 q-26 4 -26 40" fill="none" stroke="#3c4a59" stroke-width="12" stroke-linecap="round"/>
    <!-- bánh xe -->
    <circle cx="220" cy="432" r="34" fill="#222b35"/>
    <circle cx="220" cy="432" r="14" fill="#607d8b"/>
    <circle cx="384" cy="432" r="34" fill="#222b35"/>
    <circle cx="384" cy="432" r="14" fill="#607d8b"/>
  </g>

  <!-- nhãn danh mục -->
  <text x="300" y="520" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="34" font-weight="700" fill="#0e2a47">Máy trộn bê tông</text>
  <text x="300" y="556" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="18" fill="#37474f" letter-spacing="2">XINMAI · CHÍNH HÃNG</text>
</svg>